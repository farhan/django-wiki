[tox]
envlist = quality, docs, django42, django52
requires = tox-uv>=1

[testenv]
runner = uv-venv-lock-runner
changedir = {toxinidir}/testproject/
dependency_groups =
    django42: django42
    django52: test
allowlist_externals = pytest
commands =
    pytest --cov wiki --cov django_notify

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
allowlist_externals = pylint
commands =
    pylint --fail-under=0 wiki django_notify

[testenv:docs]
runner = uv-venv-lock-runner
changedir = {toxinidir}
dependency_groups = doc
allowlist_externals = make
commands =
    make -C docs html
